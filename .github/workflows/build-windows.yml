name: Build Windows VST3

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build

      - name: Build VST3
        run: cmake --build build --config Release --target SolarisOnDaSynth_VST3

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: SolarisOnDaSynth-VST3-Windows
          path: build/SolarisOnDaSynth_artefacts/Release/VST3/
